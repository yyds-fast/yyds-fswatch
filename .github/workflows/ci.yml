name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.7 is not available in the Ubuntu 24.04 tool cache used
          # by ubuntu-latest, so keep the minimum-supported runtime on 22.04.
          - os: ubuntu-22.04
            python-version: "3.7"
          - os: ubuntu-latest
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip for Python 3.7
        if: matrix.python-version == '3.7'
        run: python -m pip install --upgrade "pip<24"

      - name: Upgrade pip
        if: matrix.python-version != '3.7'
        run: python -m pip install --upgrade pip

      - name: Install project and test tools
        run: |
          python -m pip install -e . "pytest<8" ruff

      - name: Test
        run: python -m pytest -q

      - name: Lint
        run: python -m ruff check yyds_fswatch tests examples setup.py

      - name: Build distribution
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        shell: bash
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
