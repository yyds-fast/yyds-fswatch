[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py37"

[tool.ruff.lint]
# Keep the CI baseline stable as Ruff evolves. Broader style and refactor
# rules can be adopted deliberately instead of appearing after a tool update.
select = ["E4", "E7", "E9", "F"]
